channel:
  strategy: "packaging-engineering-v1"
  niche: "ingeniería de envases, tapas, cierres y precintos cotidianos"
  language: "español neutro"
  audience: "adultos curiosos de habla hispana que quieren entender cómo funcionan los envases que usan a diario"
  description: >-
    Nada de este envase está puesto al azar. Descubre la ingeniería de latas,
    botellas, tapas, bolsas y precintos en vídeos cortos: un objeto, un mecanismo
    y una explicación clara. Curiosidades en 45 segundos, ahora centrado en los
    detalles que tienes delante y casi nunca miras. Narración y edición asistidas
    por IA; las ilustraciones son explicativas, no pruebas de laboratorio.
  keywords: "ingeniería cotidiana, envases, tapas, cierres, precintos, cómo funciona, diseño de envases"
  editorial_brief: >-
    Stay exclusively within everyday packaging and closure mechanisms. Each
    episode explains one specific feature of one object, the practical problem
    it solves, and how its shape or material solves it. Show the feature before
    explaining it. Use a recognizable narrator with a brief genuine observation,
    not a generic list of facts. Do not claim to have performed experiments or
    measurements. Do not invent patents, dates, inventors, statistics or universal
    explanations for designs that vary by manufacturer. Do not cover general
    science, astronomy, animals, human biology, historical trivia or unrelated
    household objects. Do not mix multiple objects in one episode.

